[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msearchy"
version = "2.0.0"
description = "Async Python metasearch library and CLI querying DuckDuckGo, Bing, Wikipedia, and Brave in parallel."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Adarsh" }
]
keywords = [
    "metasearch",
    "search",
    "search-engine",
    "async",
    "asyncio",
    "httpx",
    "duckduckgo",
    "bing",
    "wikipedia",
    "brave",
    "web-search",
    "image-search",
    "video-search",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
http2 = ["h2>=4.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "lxml-stubs>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Adarshukumar/msearchy"
Repository = "https://github.com/Adarshukumar/msearchy"
Issues = "https://github.com/Adarshukumar/msearchy/issues"

[project.scripts]
searchy = "searchy.cli:main"
searchy-web = "searchy.web:main"

[tool.setuptools.packages.find]
include = ["searchy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
